# Инфраструктура для повседневной разработки.
# Приложение запускаешь из IDE (GreenEcoMallApplication), оно ходит на localhost-порты отсюда.
#   docker compose -f infra/docker-compose.infra.yml up -d

name: gem-infra

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gem
      POSTGRES_PASSWORD: gem
      POSTGRES_DB: gem
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gem"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  mock-mlm:
    build: ./mock-mlm
    ports:
      - "9100:9100"

volumes:
  pgdata:
