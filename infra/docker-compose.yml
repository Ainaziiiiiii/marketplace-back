# Полный прогон: инфраструктура + приложение в контейнере.
# Запуск:  docker compose -f infra/docker-compose.yml up -d --build
# API: http://localhost:8080/api/...

name: gem

services:
  postgres:
    extends:
      file: docker-compose.infra.yml
      service: postgres
  mailhog:
    extends:
      file: docker-compose.infra.yml
      service: mailhog
  mock-mlm:
    extends:
      file: docker-compose.infra.yml
      service: mock-mlm

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: green-eco-mall/app:latest
    environment:
      # одна база gem, схемы модулей создаёт Flyway при старте
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gem
      SPRING_DATASOURCE_USERNAME: gem
      SPRING_DATASOURCE_PASSWORD: gem
      # первый вход в админку; на проде задать свои значения и сменить пароль после входа
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@greenecomall.kg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      CATALOG_MEDIA_DIR: /data/media
      # ИИ для фото и корректуры текста: mock без ключа; для реальной работы — gemini + GEMINI_API_KEY
      PHOTO_AI_PROVIDER: ${PHOTO_AI_PROVIDER:-mock}
      PROOFREAD_PROVIDER: ${PROOFREAD_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MLM_BACKEND_BASE_URL: http://mock-mlm:9100
      MLM_SYNC_SHARED_SECRET: local-dev-mlm-shared-secret-change-me
    volumes:
      - catalog-media:/data/media
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  catalog-media:
